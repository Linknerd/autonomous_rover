slam_toolbox:
  ros__parameters:
    use_sim_time: false
    odom_frame: odom
    base_frame: base_footprint
    map_frame: map
    scan_topic: /scan
    mode: mapping
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
    minimum_laser_range: 0.1
    maximum_laser_range: 12.0
    throttle_scans: 3
    queue_size: 1
